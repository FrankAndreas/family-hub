# family-hub on a NAS (or any Docker host), with the published images.
# Copy it to the app folder on the NAS as compose.yaml; see README_DOCKER.md.
#
# The backend runs as PUID:PGID from .env (default 999:999, the image's own
# user). On a Synology, use a DSM user's IDs (see README_DOCKER.md). It never
# runs as root. The ./data folder must exist and belong to that user before the
# first start: it holds the database and the key that signs the logins.
#
# To try your local changes instead: docker compose up -d --build

services:
  backend:
    image: ghcr.io/frankandreas/family-hub/backend:latest
    build: ./backend
    container_name: hub-backend
    user: "${PUID:-999}:${PGID:-999}"
    volumes:
      - ./data:/app/data          # SQLite database and the signing key
    environment:
      - DATABASE_URL=sqlite:///./data/hub.db
      - DATA_DIR=./data
      # PIN for the first parent "Admin" on an empty database; empty means a
      # random PIN, printed once in the backend log
      - INITIAL_ADMIN_PIN=${INITIAL_ADMIN_PIN:-}
      # de or en: language of people who haven't picked one
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-de}
      - TZ=${TZ:-Europe/Zurich}
      # The login cookie's domain, e.g. local.<domain>: every app at home gets it,
      # the addresses through Cloudflare never do. See README_DOCKER.md
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      # Cloudflare Access for logins from outside; empty = outside requests are refused
      - CF_TEAM_DOMAIN=${CF_TEAM_DOMAIN:-}
      - CF_AUDIENCE=${CF_AUDIENCE:-}
      # Forgot PIN by e-mail through Resend: API key, sender, the hub's address
      # at home (https://home.local.<domain>); all three or it's off
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - HUB_PUBLIC_URL=${HUB_PUBLIC_URL:-}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/frankandreas/family-hub/frontend:latest
    build: ./frontend
    container_name: hub-frontend
    ports:
      - "${PORT:-8086}:8080"
    depends_on:
      - backend
    restart: unless-stopped
