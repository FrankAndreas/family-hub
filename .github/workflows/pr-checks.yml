name: Checks

on:
  # Run by pull-request.yml on PRs and by ci-cd.yml before images are built
  workflow_call:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
      - run: pip install -r backend/requirements.txt -r tests/requirements.txt black flake8 mypy
      - run: black --check backend tests client
      - run: flake8 backend tests client --max-line-length=120 --extend-ignore=E203,W503
      - run: cd backend && mypy app --ignore-missing-imports
      - run: mypy client/family_hub_client
      # The tests run the API in-process against a temporary SQLite database (see tests/conftest.py)
      - run: pytest

  theme:
    name: Theme package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exactly the files the apps need (theme/README.md): a missing one breaks every app's build after an update
      - run: |
          cd theme
          npm pack --dry-run --json | node -e "
            const files = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].files.map(f => f.path).sort();
            const want = ['README.md', 'index.d.ts', 'index.js', 'package.json', 'theme-init.js', 'theme.css'];
            if (JSON.stringify(files) !== JSON.stringify(want)) { console.error('theme package files:', files); process.exit(1); }"

  frontend:
    name: Frontend lint, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Browser tests: Playwright starts the backend (fresh SQLite database) and the frontend itself (e2e/)
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      # Only the headless browser, without --with-deps: the runner image already has Chrome's system libraries
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: |
          cd frontend && npm ci
          cd ../e2e && npm ci
          npx playwright install --only-shell chromium
      - run: cd e2e && E2E_PYTHON=python npm test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
