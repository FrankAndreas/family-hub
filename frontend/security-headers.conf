# Security headers, included in every location: nginx drops server-level add_header lines in a location that has its
# own. "always" also puts them on error answers.
# - CSP: scripts, styles, API calls only from the app itself; images also from blob: (photos before upload) and data:.
#   React's style attributes need 'unsafe-inline' for styles.
# - The token is kept in localStorage: a strict script-src is what protects it.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
